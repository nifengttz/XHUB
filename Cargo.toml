[package]
name = "wall-hub-mvp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
anyhow = "1.0"
chia-bls = "0.36.1"
chia-protocol = "0.36.1"
chia-puzzle-types = "0.36.1"
chia-sdk-driver = "=0.33.0"
chia-sdk-coinset = { version = "=0.33.0", features = ["rustls"] }
chia-sdk-utils = "=0.33.0"
chia-sdk-test = "=0.33.0"
chia-sdk-types = "=0.33.0"
chia-traits = "=0.36.1"
clvm-traits = "0.36.1"
clvm-utils = "0.36.1"
clvmr = "0.16"
hex = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
chia-consensus = "0.36.1"
chia-sdk-signer = "=0.33.0"
proptest = "1.6"
tempfile = "3.27"
