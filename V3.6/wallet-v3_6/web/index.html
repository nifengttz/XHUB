<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XHUB Wallet V3.6</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="product">XHUB Wallet</p>
      <h1>创建 Funding Coin</h1>
    </div>
    <div class="profile"><span id="gateway-dot" class="status-dot pending"></span><span id="profile-label">正在载入主网配置</span></div>
  </header>

  <main class="workspace">
    <form id="terms-form" class="form-pane" novalidate>
      <section aria-labelledby="timing-title">
        <div class="section-heading">
          <h2 id="timing-title">通道时间参数</h2>
          <span>创建后不可修改</span>
        </div>
        <div class="field-grid compact">
          <label>接受窗口（区块）
            <input name="acceptance_blocks" inputmode="numeric" required>
          </label>
          <label>冻结缓冲（区块）
            <input name="freeze_blocks" inputmode="numeric" required>
          </label>
          <label>挑战期（区块）
            <input name="challenge_blocks" inputmode="numeric" required>
          </label>
          <label>关闭延迟（自动）
            <output id="close-delay" class="readonly-value">-</output>
          </label>
        </div>
      </section>

      <section aria-labelledby="identity-title">
        <div class="section-heading">
          <h2 id="identity-title">网络与密钥</h2>
          <span>定长十六进制</span>
        </div>
        <div class="field-grid">
          <label>Network ID
            <input name="network_id" spellcheck="false" readonly required>
          </label>
          <label>用户 BLS 公钥
            <textarea name="user_public_key" spellcheck="false" rows="2" placeholder="输入钱包的 48 字节 BLS 公钥" required></textarea>
          </label>
          <label>HUB A 状态公钥
            <textarea name="hub_state_public_key_a" spellcheck="false" rows="2" readonly required></textarea>
          </label>
          <label>State Rules Hash
            <input name="state_rules_hash" spellcheck="false" readonly required>
          </label>
        </div>
      </section>

      <section aria-labelledby="funding-title">
        <div class="section-heading">
          <h2 id="funding-title">资金条款</h2>
          <span>最小单位</span>
        </div>
        <div class="field-grid">
          <label>Funding 金额
            <input name="funding_amount" inputmode="numeric" value="5" required>
          </label>
          <label>用户找零 Puzzle Hash
            <input name="user_remainder_puzzle_hash" spellcheck="false" placeholder="输入钱包找零 Puzzle Hash" required>
          </label>
        </div>
      </section>

      <div id="error" class="message error" role="alert" hidden></div>
      <button id="prepare-button" class="primary" type="submit" disabled>校验并生成条款</button>
    </form>

    <aside class="summary-pane" aria-live="polite">
      <div class="summary-header">
        <div>
          <p>条款摘要</p>
          <h2 id="summary-state">等待校验</h2>
        </div>
        <span id="lock-state" class="tag">草稿</span>
      </div>

      <dl class="metrics">
        <div><dt>协议版本</dt><dd>0x0360</dd></div>
        <div><dt>网络</dt><dd>Chia Mainnet</dd></div>
        <div><dt>配置</dt><dd id="profile-id">-</dd></div>
        <div><dt>A = F + acceptance</dt><dd id="a-relation">-</dd></div>
        <div><dt>S = A + freeze</dt><dd id="s-relation">-</dd></div>
        <div><dt>关闭延迟</dt><dd id="summary-close">-</dd></div>
        <div><dt>确认深度</dt><dd id="confirmation-blocks">-</dd></div>
        <div><dt>交付绿灯</dt><dd id="delivery-threshold">-</dd></div>
        <div><dt>HUB 网关</dt><dd id="gateway-state">检查中</dd></div>
        <div><dt>主网批准</dt><dd class="not-approved">否</dd></div>
        <div><dt>生产就绪</dt><dd class="not-approved">否</dd></div>
      </dl>

      <div class="hash-block">
        <span>Channel Terms Hash</span>
        <code id="terms-hash">校验后生成</code>
      </div>
      <details>
        <summary>规范二进制编码</summary>
        <code id="canonical-hex">校验后生成</code>
      </details>

      <label class="confirmation">
        <input id="confirm-check" type="checkbox" disabled>
        <span>我已核对完整条款，并理解确认后本 Funding Coin 的参数不可修改。</span>
      </label>
      <button id="confirm-button" class="confirm" type="button" disabled>确认并锁定条款</button>
      <p class="notice">主网 Canary：当前页面只生成并锁定协议条款，不创建或广播链上交易。</p>
    </aside>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
